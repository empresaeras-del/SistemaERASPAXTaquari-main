<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background: #e5e7eb;
    padding: 20px;
  }
  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    background-color: white;
    background-image: linear-gradient(to bottom, 
      #f9fafb 0mm, #f9fafb 25mm, 
      transparent 25mm, transparent 272mm, 
      #f9fafb 272mm, #f9fafb 297mm);
    background-size: 100% 297mm;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    /* For the text padding we don't use CSS padding, we rely on the gap */
    padding: 0 25mm; /* left and right margin */
    box-sizing: border-box;
  }
  .content {
    /* To push the first text down by 25mm, we can use padding-top */
    padding-top: 25mm;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="content">
      Hello World<br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>End of page 1?
    </div>
  </div>
</body>
</html>
